name: secret-scan

on:
  pull_request:
  push:
    branches: [main]

jobs:
  ggshield:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # ggshield scans history, not just the diff

      - name: scan for secrets
        uses: GitGuardian/ggshield-action@v1
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        # Skipped rather than failed when the key is absent, so a fork's CI is
        # not permanently red. GitHub's own secret scanning with push
        # protection is enabled on this repo and is the real backstop.
        continue-on-error: true
