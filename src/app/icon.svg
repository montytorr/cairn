<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- A cairn: stones stacked to mark a path for whoever comes next. Drawn as
       three solid slabs rather than outlines, because an outline at 16px in a
       browser tab is a smudge. -->
  <rect width="32" height="32" rx="7" fill="#5e6ad2"/>
  <g fill="#f7f8f8">
    <rect x="6"    y="21"  width="20" height="5.5" rx="2.75"/>
    <rect x="8.5"  y="13.5" width="15" height="5.5" rx="2.75"/>
    <rect x="11"   y="6.5"  width="10" height="5"   rx="2.5"/>
  </g>
</svg>
